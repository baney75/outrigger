name: Upstream compatibility
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'T3 Code npm tag or version to test'
        default: latest
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      T3_SPEC: ${{ inputs.version || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Protocol smoke against upstream T3 Code
        id: smoke
        # An explicit `shell: bash` adds -o pipefail, so a failed smoke is not hidden by tee.
        shell: bash
        run: scripts/upstream-smoke.sh "$T3_SPEC" 2>&1 | tee smoke.log
      - name: Open or update the drift issue
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Upstream T3 Code compatibility check failed'
          tail_log="$(tail -n 20 smoke.log | sed 's/token=[^[:space:]&#]*/token=[REDACTED]/g')"
          {
            echo "The scheduled smoke against \`t3@${T3_SPEC}\` failed."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo 'Last log lines:'
            echo
            echo '```'
            echo "${tail_log}"
            echo '```'
            echo
            echo "Run \`scripts/upstream-smoke.sh ${T3_SPEC}\` locally to reproduce. Compare the upstream orchestration protocol with the README compatibility table before changing support."
          } > body.md
          gh label create upstream-drift --color B60205 --description 'Upstream T3 Code changed' 2>/dev/null || true
          number="$(gh issue list --state open --label upstream-drift --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --label upstream-drift --body-file body.md
          fi
